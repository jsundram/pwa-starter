name: checks

# Guards for sw.js — the offline service worker. Its contract is subtle and easy to regress, so
# both halves run on every push and PR with real exit codes:
#   - node scripts/sw.test.mjs : behavioral tests of the fetch handler (cache-first, lie-fi
#     bounds, offline fallbacks) against a mocked SW environment.
#   - scripts/sw-lint.py       : the precache-contract checks (the pre-commit hook runs these
#     warn-only; here they fail the build). NB its headline check — a staged SHELL file touched
#     without a V bump — reads `git diff --cached`, which is empty in a CI checkout, so THAT check
#     only bites locally in the hook; CI enforces the other five (missing/renamed entries,
#     cross-origin entries, V's numeric tail, VER_PREFIX agreement, APP_V agreement).
#   - scripts/sw-lint.py --base : the one check that NEEDS CI, because it needs both sides of the
#     merge. Two branches off one base can each bump v32 -> v33 byte-identically and the merge
#     resolves silently to a net V delta of zero — correct from either side alone, broken once
#     joined. PR-only (on a push to main there is nothing to merge into), and it requires
#     fetch-depth: 0: with the default shallow checkout there is no merge base, and the check
#     REPORTS that rather than passing, which would fail every PR.
#   - scripts/sw-lint.test.py  : proves the --base check catches that incident and nothing else,
#     by building real throwaway repos with real branches.
#   - scripts/og-lint.py is NOT here for the same reason it can't be: it only inspects the staged
#     OG card (`git diff --cached`), so in CI it has nothing to check. It stays a hook-only guard.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # --base needs a merge base; a shallow clone has none
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: syntax-check sw.js
        run: node --check sw.js
      - name: behavioral tests (scripts/sw.test.mjs)
        run: node scripts/sw.test.mjs
      - name: precache lint (scripts/sw-lint.py)
        run: python3 scripts/sw-lint.py
      - name: --base check tests (scripts/sw-lint.test.py)
        run: python3 scripts/sw-lint.test.py
      # HEAD here is GitHub's merge commit (PR merged into the base), which is exactly the thing
      # the check is asking about: "once this lands, will V have moved?"
      - name: branch V check (scripts/sw-lint.py --base)
        if: github.event_name == 'pull_request'
        run: python3 scripts/sw-lint.py --base "origin/${{ github.base_ref }}"
